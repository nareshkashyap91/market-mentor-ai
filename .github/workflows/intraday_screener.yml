name: Run Intraday Breakout Signals

on:
  schedule:
    # Runs every 15 minutes, from 4:00 AM UTC (9:30 AM IST) to 10:00 AM UTC (3:30 PM IST)
    # Mondays to Fridays. Automatically checks the latest 15m candle for breakouts.
    - cron: '*/15 4-10 * * 1-5'
  workflow_dispatch:
    # Allows manually running the intraday scan from the GitHub interface at any time

jobs:
  run-intraday:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Allow committing and pushing data back to the repository

    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run MarketMentor Intraday Screener & Broadcast
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python intraday_screener.py

      - name: Commit and push updated data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/*.json
          git diff-index --quiet HEAD || git commit -m "Auto-update dashboard data [skip ci]"
          git push
