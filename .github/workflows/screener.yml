name: Run Market Wrap Screener

on:
  schedule:
    # Runs Monday to Friday at 11:30 AM UTC (which is 5:00 PM IST)
    # Market closes at 3:30 PM IST, so 5:00 PM IST is perfect for EOD data updates.
    - cron: '30 11 * * 1-5'
  workflow_dispatch:
    # Allows manually running the screener from the GitHub interface at any time

jobs:
  run-screener:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Allow committing and pushing data back to the repository

    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run MarketMentor Screener & Broadcast
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python screener.py

      - name: Commit and push updated data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/*.json
          git diff-index --quiet HEAD || git commit -m "Auto-update dashboard data [skip ci]"
          git push
