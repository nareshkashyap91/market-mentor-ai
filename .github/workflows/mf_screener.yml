name: Run Weekly Mutual Fund Wealth Report

on:
  schedule:
    # Runs every Sunday at 4:30 AM UTC (10:00 AM IST)
    - cron: '30 4 * * 0'
  workflow_dispatch:
    # Allows manual triggering

jobs:
  run-mf:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run MarketMentor Weekly Mutual Fund Screener
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python mf_screener.py

      - name: Commit and push updated data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/*.json
          git diff-index --quiet HEAD || git commit -m "Auto-update mutual funds data [skip ci]"
          git push
