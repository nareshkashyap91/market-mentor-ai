name: Run Morning Pre-Market Clues

on:
  schedule:
    # Runs Monday to Friday at 2:30 AM UTC (which is 8:00 AM IST)
    # Perfect for parsing GIFT Nifty and global pre-market insights before opening.
    - cron: '30 2 * * 1-5'
  workflow_dispatch:
    # Allows manually running the morning clues from the GitHub interface at any time

jobs:
  run-morning:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run MarketMentor Morning Screener & Broadcast
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python morning_screener.py
