name: MarketMentor AI 15-Min Live Master Pulse

on:
  schedule:
    # Runs every 15 minutes from 8:30 AM IST (3:00 AM UTC) to 4:30 PM IST (11:00 AM UTC), Monday to Friday
    - cron: '*/15 3-11 * * 1-5'
  workflow_dispatch:
    # Allows manual triggering or external API cron-job.org dispatch

jobs:
  run-master-pulse:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Master Unified Data Fetcher Pipeline
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python master_data_fetcher.py

      - name: Commit & Push Updated Data to Dashboard
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/*.json
          git diff-index --quiet HEAD || git commit -m "Auto-update Master Unified Data Pipeline [skip ci]"
          git pull --rebase origin main || true
          git push
