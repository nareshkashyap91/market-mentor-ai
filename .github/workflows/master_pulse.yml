name: MarketMentor AI Master Engine Pulse

on:
  schedule:
    # Runs every 15 minutes from 9:15 AM IST (3:45 AM UTC) to 3:30 PM IST (10:00 AM UTC), Monday-Friday
    - cron: '*/15 3-10 * * 1-5'
  workflow_dispatch:
    # Manual trigger anytime

jobs:
  run-master-pulse:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run AI Options Quant Engine & Telegram Alert
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python ai_options_quant.py
          python intraday_screener.py

      - name: Commit & Push Updated Data to Dashboard
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/*.json
          git diff-index --quiet HEAD || git commit -m "Auto-update AI Options Quant & Intraday data [skip ci]"
          git push
